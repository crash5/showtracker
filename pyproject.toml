[build-system]
requires = ["setuptools >= 64.0", "setuptools_scm >= 8"]
build-backend = "setuptools.build_meta"

[project]
name = "showtracker"
dynamic = ["version"]
description = "TV show airdate and tracking"
authors = [{ name = "Imre NAGY" }]
readme = "README.md"

requires-python = ">= 3.10"
dependencies = [
    "flask",
    "python-dotenv",
    "flask-login",
    "flask-apscheduler",
    "flask-sqlalchemy",
    "gunicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "flake8",
    "flake8-pyproject",
    "black",
    "isort"
]

[tool.setuptools_scm]
version_file = "src/showtracker/VERSION"
version_file_template = "{version}"


#############################
# External tool configuration
#############################

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --quiet -r A --import-mode=importlib"
testpaths = ["tests"]

[tool.flake8]
max-line-length = 200
extend-ignore = "E203, E701"

[tool.mypy]
files = ["src/"]
pretty = true
strict = true
check_untyped_defs = true

disallow_untyped_defs = true
allow_untyped_calls = false
# disallow_any_expr = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
enable_error_code = "redundant-expr, truthy-bool, truthy-iterable, unused-awaitable"
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
